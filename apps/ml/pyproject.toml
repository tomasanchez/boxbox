[project]
name = "boxbox-ml"
version = "0.1.0"
description = "BoxBox ML - fastf1 ingest, feature engineering and tyre-degradation models"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Tomas Sanchez", email = "info@tomsanchez.com" }]

dependencies = [
    "fastf1>=3.8.3",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "seaborn>=0.13",
]

[project.scripts]
boxbox-ingest = "boxbox_ml.ingest:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boxbox_ml"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
